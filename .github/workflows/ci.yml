name: CI

on:
  # `push` restrito a main e `pull_request` para o resto, de propósito: com
  # push em '**' todo branch com PR aberto dispara DUAS execuções idênticas
  # (uma pelo push, outra pelo PR), que gastam runner e poluem a lista de checks.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo cancela a verificação do anterior no mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma versão do Dockerfile e do campo engines — validar em outra
          # versão daria confiança sobre algo que não é o que roda em produção.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        # Inclui test/config.test.ts, que lê os arquivos reais de config/ e falha
        # se um limiar for editado para um valor incoerente. Tudo offline.
        run: npm test

      - name: Build
        run: npm run build

      - name: Conferir que os dois bots iniciam a partir do build
        # `--help` não existe nesses entrypoints; o que se verifica aqui é que o
        # JS compilado carrega — import quebrado, extensão .js faltando num import
        # relativo ou config ilegível aparecem como falha de módulo, não em runtime
        # às 3 da manhã. NETWORK inválida faz o processo sair logo após carregar tudo.
        env:
          NETWORK: rede-inexistente-de-proposito
          DRY_RUN: 'true'
        run: |
          for bot in launches signals; do
            echo "::group::$bot"
            saida=$(node "dist/bots/$bot/index.js" 2>&1 || true)
            echo "$saida"
            echo "::endgroup::"
            # Tem de falhar pela rede inválida, não por módulo ausente.
            if ! grep -q "Disponíveis" <<<"$saida"; then
              echo "::error::dist/bots/$bot/index.js não carregou corretamente"
              exit 1
            fi
          done

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # load: coloca a imagem no daemon local para o passo seguinte rodá-la.
          load: true
          tags: arc-telegram-bots:ci
          # Sem cache de propósito: o cache do GitHub Actions exige escopo extra de
          # permissão e vira um modo de falha próprio. Este build é curto (npm ci +
          # tsc); cache só valeria a pena com volume de CI muito maior.

      - name: Conferir que a imagem roda e enxerga config/
        # A imagem copia config/ e o loader resolve o caminho a partir de dist/;
        # se essa resolução quebrar, o bot sobe e morre no primeiro boot.
        run: |
          saida=$(docker run --rm -e NETWORK=rede-inexistente-de-proposito \
            arc-telegram-bots:ci 2>&1 || true)
          echo "$saida"
          grep -q "Disponíveis" <<<"$saida" \
            || { echo "::error::a imagem não conseguiu carregar config/"; exit 1; }
